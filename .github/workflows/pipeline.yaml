name: CI-CD Pipeline System Metrics Agent

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Configuration des TESTS UNITAIRES
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run automated tests
        run: |
          PYTHONPATH=. pytest tests/

  # SCAN SECURITY (CODE SOURCE)
  security-scan:
    runs-on: ubuntu-latest
    needs: run-tests 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan repository with Trivy FS
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  #  BUILD & SCAN TRIVY (IMAGES LOCALES)
  docker-validation:
    runs-on: ubuntu-latest
    needs: security-scan 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: metrics-agent-api:test-local

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'metrics-agent-api:test-local'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Build Agent Image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: metrics-agent-collector:test-local

      - name: Scan Agent Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'metrics-agent-collector:test-local'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # PUBLICATION (DOCKER HUB PUSH)
  publish-to-dockerhub:
    runs-on: ubuntu-latest
    needs: docker-validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent-api:${{ github.sha }}

      - name: Build and Push Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent-collector:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/metrics-agent-collector:${{ github.sha }}